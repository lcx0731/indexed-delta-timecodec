[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "indexed-delta-timecodec"
version = "0.1.0"
description = "Lossless signed-int64 timestamp blocks with range indexes and explicit validation scope"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]
demo = ["matplotlib>=3.9,<4"]

[project.scripts]
timecodec-demo = "timecodec.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
