name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and optional test/demo dependencies
        run: python -m pip install '.[test,demo]'
      - name: Codec, corruption, query, and CLI tests
        run: python -m pytest -W error
      - name: Reproduce full synthetic experiment
        run: python -W error -m timecodec.experiment --output /tmp/timecodec-results
      - name: Check dependency consistency
        run: python -m pip check
